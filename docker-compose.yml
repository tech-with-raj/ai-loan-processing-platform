
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bestbank
      POSTGRES_USER: bestbank
      POSTGRES_PASSWORD: bestbank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestbank -d bestbank"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://bestbank:bestbank@postgres:5432/bestbank
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
